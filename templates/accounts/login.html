{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Login · HTC Core{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{% static 'css/htc-theme.css' %}?v=5" rel="stylesheet">
</head>
<script>
    (function() {
        var theme = localStorage.getItem('htc-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
    })();
</script>
<body>
    <div class="login-page-wrapper">
        <div class="glass-login-card">
            <img src="{% static 'img/htc-logo.png' %}" alt="HTC Logo" class="login-logo">
            <h1 class="login-company-name">Heindrich Trading Corporation</h1>
            <p class="login-subtitle">Core Management System</p>

            {% if messages %}
                {% for message in messages %}
                <div class="alert-banner" style="width: 100%;">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="post">{% csrf_token %}
                <div class="mb-3">
                    <label class="form-label-htc">Username</label>
                    <input type="text" name="username" class="form-control-htc" required autofocus placeholder="Enter username">
                </div>
                <div class="mb-3">
                    <label class="form-label-htc">Password</label>
                    <input type="password" name="password" class="form-control-htc" required placeholder="Enter password">
                </div>
                <div class="mb-4">
                    <label class="form-label-htc">Role (Optional)</label>
                    <select class="form-control-htc" name="role_optional">
                        <option value="">Select role</option>
                        <option value="management">Management</option>
                        <option value="finance">Finance</option>
                        <option value="operations">Operations</option>
                        <option value="invoicing">Invoicing</option>
                    </select>
                </div>
                <button type="submit" class="btn-htc-primary">Login</button>
            </form>
            
            <div style="margin-top: 1.5rem;">
                <button type="button" class="btn-theme-toggle" id="themeToggleBtn" style="background: none; border: none; color: var(--htc-text-muted); font-size: 1.25rem; cursor: pointer;" title="Toggle Theme">
                    <i class="bi bi-moon-stars-fill"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const htmlTag = document.documentElement;
        
        function updateThemeIcon() {
            if (htmlTag.getAttribute('data-theme') === 'light') {
                themeToggleBtn.innerHTML = '<i class="bi bi-moon-stars-fill"></i>';
            } else {
                themeToggleBtn.innerHTML = '<i class="bi bi-sun-fill"></i>';
            }
        }
        
        if (themeToggleBtn) {
            updateThemeIcon();
            themeToggleBtn.addEventListener('click', function() {
                const currentTheme = htmlTag.getAttribute('data-theme') || 'dark';
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                htmlTag.setAttribute('data-theme', newTheme);
                localStorage.setItem('htc-theme', newTheme);
                updateThemeIcon();
            });
        }
    </script>
</body>
</html>
