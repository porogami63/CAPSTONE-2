services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-htc_core}
      POSTGRES_USER: ${POSTGRES_USER:-htc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-htc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U htc -d htc_core"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - htc_net

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - htc_net

  web:
    build: .
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    environment:
      DEBUG: "${DEBUG:-False}"
      SECRET_KEY: "${SECRET_KEY:-pilot-change-me-before-uat}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-*}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-htc}:${POSTGRES_PASSWORD:-htc}@db:5432/${POSTGRES_DB:-htc_core}"
      CELERY_TASK_ALWAYS_EAGER: "${CELERY_TASK_ALWAYS_EAGER:-False}"
      CELERY_TASK_EAGER_PROPAGATES: "${CELERY_TASK_EAGER_PROPAGATES:-False}"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/accounts/login/\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - htc_net
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./templates:/app/templates
      - ./operations:/app/operations
      - ./finance:/app/finance
      - ./accounts:/app/accounts
      - ./masters:/app/masters
      - ./config:/app/config
      - ./static:/app/static

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - htc_net

  celery_worker:
    build: .
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: >
      sh -c "celery -A config worker -l INFO"
    environment:
      DEBUG: "${DEBUG:-False}"
      SECRET_KEY: "${SECRET_KEY:-pilot-change-me-before-uat}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-htc}:${POSTGRES_PASSWORD:-htc}@db:5432/${POSTGRES_DB:-htc_core}"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    volumes:
      - ./operations:/app/operations
      - ./finance:/app/finance
      - ./accounts:/app/accounts
      - ./masters:/app/masters
      - ./config:/app/config
      - ./templates:/app/templates
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - htc_net

networks:
  htc_net:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
  media_volume:
